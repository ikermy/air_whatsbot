name: CD AirWhatsBot Production

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/air_whatsbot

jobs:
  test:
    runs-on: ubuntu-latest
    name: Setup, test, and build project
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build application
        run: go build -trimpath -ldflags="-s -w" ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    name: Tag, build, and push image
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.versioning.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get next version
        id: versioning
        run: |
          # Get latest tag or default to v1.27.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.27.0")
          echo "Latest tag: $LATEST_TAG"

          # Parse version components
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          # Get commit message to determine bump type
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          if [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MSG" =~ [a-z]+\!: ]]; then
            echo "Major bump detected"
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$COMMIT_MSG" == *"feat:"* ]]; then
            echo "Minor bump detected"
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            echo "Patch bump detected (default)"
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New calculated tag: $NEW_TAG"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a ${{ steps.versioning.outputs.tag }} -m "${{ github.event.head_commit.message }}"
          git push origin ${{ steps.versioning.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versioning.outputs.tag }}
          build-args: |
            VERSION=${{ steps.versioning.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deploy to production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          HOST: ${{ secrets.HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          test -n "$HOST" || { echo "HOST is not configured"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY is not configured"; exit 1; }
          test -n "$DB_USER" || { echo "DB_USER is not configured"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "DB_PASSWORD is not configured"; exit 1; }
          test -n "$SERVICE_KEY" || { echo "SERVICE_KEY is not configured"; exit 1; }

      - name: Write release version marker
        run: echo "${{ needs.build-and-push.outputs.tag }}" > ver.txt

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Check SSH connectivity
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          echo "HOST set: $([ -n "$HOST" ] && echo yes || echo no), USERNAME set: $([ -n "$USERNAME" ] && echo yes || echo no)"
          echo "--- TCP :22 ---"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/22" && echo "TCP 22 reachable" || echo "TCP 22 NOT reachable"
          echo "--- SSH banner ---"
          timeout 15 ssh-keyscan -T 10 "$HOST" || echo "ssh-keyscan failed"
          echo "--- ssh verbose ---"
          timeout 25 ssh -vv -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -i ~/.ssh/id_deploy "$USERNAME@$HOST" true || true

      - name: Copy configs to server
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          for i in 1 2 3; do
            if scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_deploy prod.yml ver.txt "$USERNAME@$HOST:/bot/marusia/air_whatsbot/"; then
              echo "scp OK"
              exit 0
            fi
            echo "scp attempt $i failed"
            sleep 10
          done
          exit 1

      - name: Deploy to server via SSH
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          B64_GH_TOKEN=$(printf '%s' "$GH_TOKEN" | base64 -w0)
          B64_SERVICE_KEY=$(printf '%s' "$SERVICE_KEY" | base64 -w0)
          B64_DB_USER=$(printf '%s' "$(printf '%s' "$DB_USER" | tr -d '\r\n')" | base64 -w0)
          B64_DB_PASSWORD=$(printf '%s' "$(printf '%s' "$DB_PASSWORD" | tr -d '\r\n')" | base64 -w0)
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -i ~/.ssh/id_deploy \
            "$USERNAME@$HOST" \
            "B64_GH_TOKEN='$B64_GH_TOKEN' B64_SERVICE_KEY='$B64_SERVICE_KEY' B64_DB_USER='$B64_DB_USER' B64_DB_PASSWORD='$B64_DB_PASSWORD' REGISTRY='$REGISTRY' IMAGE_NAME='$IMAGE_NAME' HOST='$HOST' ACTOR='$ACTOR' bash -s" <<'REMOTE'
          set -e
          cd /bot/marusia/air_whatsbot
          printf '%s' "$B64_GH_TOKEN" | base64 -d | docker login ghcr.io -u "$ACTOR" --password-stdin

          # Create secret file for ConfigService
          printf '%s' "$B64_SERVICE_KEY" | base64 -d > .service_key
          chmod 600 .service_key

          # 1. Create .env file for Docker Compose
          printf 'DOMAIN=%s\n' "$(printf '%s' "$HOST" | tr -d '\r\n')" > .env
          printf 'DB_USER=' >> .env
          printf '%s' "$B64_DB_USER" | base64 -d >> .env
          printf '\n' >> .env
          printf 'DB_PASSWORD=' >> .env
          printf '%s' "$B64_DB_PASSWORD" | base64 -d >> .env
          printf '\n' >> .env
          chmod 600 .env

          # 2. Pull from GHCR and tag locally with the name used by prod.yml
          FULL_IMAGE_NAME="$REGISTRY/$IMAGE_NAME:prod"
          docker pull "$FULL_IMAGE_NAME"
          docker tag "$FULL_IMAGE_NAME" whatsbot:prod

          # 3. Restart application
          docker compose -f prod.yml up -d --force-recreate --no-build
          docker image prune -f
          REMOTE
